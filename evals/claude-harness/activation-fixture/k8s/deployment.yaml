apiVersion: apps/v1
kind: Deployment
metadata: { name: api }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: acme/api:1.4.2
          env: [{ name: DATABASE_URL, valueFrom: { secretKeyRef: { name: db, key: url } } }]
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 1 }
